name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@latest
      - run: openspec validate --all --strict

  app:
    name: Build iPad app (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned ClayCore tag
        id: claycore
        run: echo "ref=$(tr -d '[:space:]' < ClayCore.version)" >> "$GITHUB_OUTPUT"
      - name: Checkout ClayCore (pinned tag)
        uses: actions/checkout@v4
        with:
          repository: CyberdyneCorp/ClayCore
          ref: ${{ steps.claycore.outputs.ref }}
          path: ClayCore
      - name: Place ClayCore as sibling checkout
        run: mv ClayCore ../ClayCore
      - name: Build claycore xcframework
        run: ../ClayCore/tools/build_xcframework.sh
      - name: Install xcodegen
        run: brew install xcodegen xcbeautify
      - name: Generate Xcode project
        run: xcodegen generate --spec app/project.yml --project app
      - name: Run tests on iOS Simulator
        # pipefail, not `|| exit ${PIPESTATUS[0]}`: the `||` reads the
        # PIPELINE's status, which is xcbeautify's, and xcbeautify exits 0
        # even when xcodebuild failed — so the exit never fired and this
        # job reported success through a build that did not compile.
        run: |
          set -o pipefail
          xcodebuild test \
            -project app/ClaySpace.xcodeproj \
            -scheme ClaySpace \
            -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M4)' \
            -resultBundlePath test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      # xcbeautify prints a filtered view, so a crash inside the test host
      # reaches the log as "<external symbol>" and nothing else. Keep the
      # result bundle and the simulator's crash reports on every run —
      # a failure nobody can diagnose costs more than the upload.
      - name: Collect simulator crash reports
        if: always()
        run: |
          mkdir -p crash-reports
          cp -R ~/Library/Logs/DiagnosticReports/. crash-reports/ 2>/dev/null || true
          ls -la crash-reports || true
      - name: Upload test results and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xcresult
            crash-reports
          if-no-files-found: warn
          retention-days: 14
