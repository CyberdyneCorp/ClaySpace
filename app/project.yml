name: ClaySpace
options:
  bundleIdPrefix: com.cyberdyne
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# ClayCore (https://github.com/CyberdyneCorp/ClayCore) is consumed as a
# sibling checkout pinned to a release tag; its Package.swift wraps the
# prebuilt dist/claycore.xcframework (run tools/build_xcframework.sh in
# the ClayCore repo after checking out the tag). The tag itself lives in
# ClayCore.version at the repo root — the one place CI and this comment
# used to disagree, so it is no longer restated here.
packages:
  claycore:
    path: ../../ClayCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES   # lets the (perf) tests run against Release too
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2C69VJZSNR
    # claycore is a C++-implemented static library behind a C ABI: link
    # libc++; the xcframework's simulator slice is arm64-only.
    #
    OTHER_LDFLAGS: "-lc++"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  ClaySpace:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ClaySpace
    dependencies:
      - package: claycore
        product: claycore
    # Explicit Info.plist: file sharing + open-in-place expose Documents in
    # the Files app; the .clayspace package UTI makes each sculpt read as a
    # single document there.
    info:
      path: ClaySpace/Info.plist
      properties:
        CFBundleDisplayName: ClaySpace
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cyberdyne.clayspace.sculpt
            UTTypeDescription: ClaySpace Sculpt
            UTTypeConformsTo: [com.apple.package, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [clayspace]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: public.geometry-definition-format
            UTTypeDescription: Wavefront OBJ
            UTTypeConformsTo: [public.data, public.3d-content]
            UTTypeTagSpecification:
              public.filename-extension: [obj]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ClaySpace Sculpt
            LSItemContentTypes: [com.cyberdyne.clayspace.sculpt]
            LSHandlerRank: Owner
          - CFBundleTypeName: Wavefront OBJ
            LSItemContentTypes: [public.geometry-definition-format]
            LSHandlerRank: Alternate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyberdyne.clayspace
        TARGETED_DEVICE_FAMILY: "2"          # iPad only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ClayCore >= 0.26 vends its binaryTarget behind an empty
        # ClayCoreLink wrapper (it exists to carry -framework
        # Metal/Foundation). Xcode 26 builds that wrapper as a dynamic
        # PackageProduct framework, and with no code inside it referencing
        # the archive the linker pulls no members — every clay_* symbol
        # comes up undefined at the app link. Force-loading the slice's
        # archive restores what linking the binaryTarget directly did at
        # 0.25.0. App target only: the test bundle resolves clay_* through
        # BUNDLE_LOADER, and a second copy would fork library state.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "-lc++ -Wl,-force_load,$(SRCROOT)/../../ClayCore/dist/claycore.xcframework/ios-arm64-simulator/libclaycore-ios-sim.a"
        "OTHER_LDFLAGS[sdk=iphoneos*]": "-lc++ -Wl,-force_load,$(SRCROOT)/../../ClayCore/dist/claycore.xcframework/ios-arm64/libclaycore-ios.a"

  ClaySpaceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/ClaySpaceTests
    dependencies:
      - target: ClaySpace
      - package: claycore
        product: claycore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClaySpace.app/ClaySpace"
        BUNDLE_LOADER: "$(TEST_HOST)"

  ClaySpaceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests/ClaySpaceUITests
    dependencies:
      - target: ClaySpace
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ClaySpace

schemes:
  ClaySpace:
    build:
      targets:
        ClaySpace: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      # The golden bundle reads CLAY_GOLDEN_REBASELINE from the HOST app's
      # environment. `TEST_RUNNER_`-prefixed settings only reach a UI-test
      # runner, never an app-hosted unit bundle, so the flag is carried
      # here instead and expanded from the build setting of the same name:
      # `xcodebuild ... CLAY_GOLDEN_REBASELINE=1` reaches the tests, and an
      # ordinary run expands to empty and stays in compare mode.
      environmentVariables:
        CLAY_GOLDEN_REBASELINE: $(CLAY_GOLDEN_REBASELINE)
      targets:
        - ClaySpaceTests
        - ClaySpaceUITests
